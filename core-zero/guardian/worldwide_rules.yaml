    - "United States: applicable federal, state, sector-specific and local requirements"
    - "United Kingdom: UK GDPR and applicable product-safety requirements"
    - "China: applicable personal-information, cybersecurity and product rules"
    - "Japan: applicable privacy, electrical and product-safety rules"
    - "Other countries: local law must be independently researched and verified"
block_categories: [weapons, warfare, explosives, malware_and_credential_theft, covert_surveillance, non_consensual_tracking, privacy_violations, unauthorized_safety_control_bypass, illegal_operation]
required_gates: [deterministic_guardian_screening, candidate_validation, provenance_and_integrity_checks, professional_review_for_hazardous_hardware, human_approval, explicit_merge]
notes:
