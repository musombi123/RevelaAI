    FileRecord:
      type: object
      required: [path, sha256, bytes]
      properties:
        path: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        bytes: {type: integer, minimum: 0}
        language: {type: string}
    ScanEvidence:
