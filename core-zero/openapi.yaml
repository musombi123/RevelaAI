      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, candidate]
              properties:
                current: {$ref: '#/components/schemas/RadarEvidence'}
                candidate: {$ref: '#/components/schemas/RadarEvidence'}
      responses:
        '200': {description: Deterministic comparison and human-review recommendation; no network used.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/bridge/plan:
    post:
      tags: [bridge]
      operationId: createBridgePlan
      summary: Return an adapter plan without accessing a device or vendor API
      security: [{ApiKey: []}]
      x-required-scope: bridge:propose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: string, enum: [ros2, fpga, labview, device]}
      responses:
        '200': {description: Review plan; no external device or network access.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/mind/compile:
    post:
      tags: [mind]
      operationId: compileRvLangPlan
      summary: Compile a bounded RV Lang program into non-executing Go plan source
      security: [{ApiKey: []}]
      x-required-scope: mind:compile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: {type: string, maxLength: 65536}
      responses:
        '200': {description: Plan generated, not executed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/mind/ide:
    get:
      tags: [mind]
      operationId: getOfflineRvLangIde
      summary: Serve the bundled local RV Lang plan editor
      responses:
        '200': {description: Local HTML IDE; API requests still require an approved key.}
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Approved scoped key; never place secrets in URLs.
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Local operator token from USECT_ZERO_ADMIN_TOKEN.
  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{24}$'}
  responses:
    Unauthorized:
      description: Authentication, scope or approval requirement not satisfied.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Invalid input or unsupported configuration.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State transition rejected; no unsafe action was executed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Local state or required repository evidence unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [status, code, message]
      properties:
        status: {type: string, const: error}
        code: {type: string}
        message: {type: string}
    Health:
      type: object
      required: [status, service, model_free, offline_mode, execution_policy]
      properties:
        status: {type: string}
        service: {type: string}
        model_free: {type: boolean}
        offline_mode: {type: boolean}
        repository_root: {type: string}
        execution_policy: {type: string}
        hardware_actuation: {type: boolean}
    FileRecord:
      type: object
      required: [path, sha256, bytes]
      properties:
        path: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        bytes: {type: integer, minimum: 0}
        language: {type: string}
    ScanEvidence:
      type: object
      required: [schema_version, generated_at, repository_root, file_count, language_counts, files, manifest_sha256, read_only]
      properties:
        schema_version: {type: string}
        generated_at: {type: string, format: date-time}
        repository_root: {type: string}
        git_head: {type: string}
        file_count: {type: integer}
        language_counts: {type: object, additionalProperties: {type: integer}}
        changelog_paths: {type: array, items: {type: string}}
        files: {type: array, items: {$ref: '#/components/schemas/FileRecord'}}
        manifest_sha256: {type: string}
        read_only: {type: boolean}
        evidence_note: {type: string}
    KeyRequestInput:
      type: object
      required: [name, email, reason]
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email, maxLength: 254}
        repository_url: {type: string, format: uri, description: Optional HTTPS repository URL.}
        reason: {type: string, minLength: 8, maxLength: 1200}
        scopes:
          type: array
          uniqueItems: true
          items: {type: string, enum: [scan:read, heal:propose, assemble:propose, radar:compare, mind:compile, bridge:propose]}
    KeyRequestAccepted:
      type: object
      required: [status, request, secret_issued, message]
      properties:
        status: {type: string, const: pending_approval}
        request: {type: object}
        secret_issued: {type: boolean, const: false}
        message: {type: string}
    KeyIssued:
      type: object
      required: [status, request, api_key, shown_once, note]
      properties:
        status: {type: string, const: approved}
        request: {type: object}
        api_key: {type: string, writeOnly: true}
        shown_once: {type: boolean, const: true}
        note: {type: string}
    AssemblyBoardProfile:
      type: object
      required: [id, family, logic_voltage_mv, typical_input_voltage_mv, pin_map_status, notes, hardware_verified]
      properties:
        id: {type: string}
        family: {type: string}
        logic_voltage_mv: {type: integer, minimum: 1}
        typical_input_voltage_mv: {type: integer, minimum: 1}
        pin_map_status: {type: string, const: exact_board_revision_required}
        notes: {type: string}
        hardware_verified: {type: boolean, const: false}
    AssemblyTemplateSummary:
      type: object
      required: [id, target, version, title, board_profile_id, part_count, connection_count, validation_status, electrical_review_required, human_review_required]
      properties:
        id: {type: string}
        target: {type: string}
        version: {type: string, pattern: '^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$'}
        title: {type: string}
        board_profile_id: {type: string}
        part_count: {type: integer, minimum: 0}
