        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/heal/proposals/{proposal_id}/approve:
    post:
      tags: [heal]
      operationId: approveFileRecovery
