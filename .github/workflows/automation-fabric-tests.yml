name: Automation Fabric safety tests

on:
  push:
    branches: [main, "feat/automation-fabric-v1"]
  pull_request:
    branches: [main]

jobs:
  automation-fabric-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip\n          python -m pip install -r requirements.txt
      - name: Compile new module and application wiring
        run: python -m compileall -q automation_fabric routes/automation_fabric_routes.py app.py
      - name: Run Automation Fabric tests
        run: python -m pytest -q tests/test_automation_fabric.py
