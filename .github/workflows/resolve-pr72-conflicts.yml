name: Resolve PR 72 FastAPI migration merge conflicts

on:
  push:
    branches:
      - migration/fastapi-shared-routes
    paths:
      - .github/workflows/resolve-pr72-conflicts.yml

permissions:
  contents: write

concurrency:
  group: resolve-pr72-fastapi-migration
  cancel-in-progress: false

jobs:
  merge-main-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/fastapi-shared-routes
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge current main while preserving migration-side conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push origin HEAD:migration/fastapi-shared-routes
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install migration dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile migrated application and route modules
        run: |
          python -m py_compile app.py asgi.py
          python -m compileall -q routes fastapi_routes automation_fabric meta_engineer revelai
      - name: Run FastAPI migration regression suite
        run: |
          python -m pytest -q \
            tests/test_fastapi_entrypoint.py \
            tests/test_automation_fabric.py \
            tests/test_meta_engineer.py \
            tests/test_self_building_core.py \
            tests/test_brain_os.py \
            tests/test_agi_manifest.py \
            tests/test_sci_core.py \
            tests/test_gemini_routing.py \
            tests/test_identity_header.py \
            tests/test_live_vision.py \
            tests/test_usect_zero_admin_verification.py \
            tests/test_usect_zero_backend.py
