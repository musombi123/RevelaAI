name: USECT-EVOLVE and USECT-MIGRATE tests

on:
  pull_request:
    paths:
      - "core_evolve/**"
      - "core_migrate/**"
      - "fastapi_routes/evolve_migrate.py"
      - "asgi.py"
      - "tests/test_usect_evolve_migrate.py"
      - ".github/workflows/usect-evolve-migrate.yml"
  push:
    branches: [main, usect-evolve-migrate]
    paths:
      - "core_evolve/**"
      - "core_migrate/**"
      - "fastapi_routes/evolve_migrate.py"
      - "asgi.py"
      - "tests/test_usect_evolve_migrate.py"
      - ".github/workflows/usect-evolve-migrate.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install "pydantic>=2.7,<3" "fastapi>=0.115,<1" "pytest>=8,<9"
      - name: Compile new organs and router
        run: python -m compileall -q core_evolve core_migrate fastapi_routes/evolve_migrate.py
      - name: Run USECT-EVOLVE and USECT-MIGRATE tests
        run: python -m pytest -q tests/test_usect_evolve_migrate.py
