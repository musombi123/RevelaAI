name: Brain OS scheduled defensive monitoring

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-os-defensive-monitor
  cancel-in-progress: false

jobs:
  defensive-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVELAAI_ALERT_WEBHOOK_URL: ${{ secrets.REVELAAI_ALERT_WEBHOOK_URL }}
    REVELAAI_MONITOR_TARGETS_JSON: ${{ vars.REVELAAI_MONITOR_TARGETS_JSON }}
    REVELAAI_MONITOR_ALLOWED_HOSTS: ${{ vars.REVELAAI_MONITOR_ALLOWED_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependencies
        run: python -m pip install --disable-pip-version-check requests pymongo flask
      - name: Run read-only defensive checks and deliver alerts
        run: python -m revelai.sci_core.monitor_runner
