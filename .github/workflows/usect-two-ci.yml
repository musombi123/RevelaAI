name: USECT-TWO Core Mesh Integration Checks

on:
  push:
    paths:
      - "core-two/**"
      - "ai/core_mesh.py"
      - "ai/orchestrator.py"
      - "ai/unknown_learning.py"
      - "ai/worldwide_context.py"
      - "ai/living_brain.py"
      - "services/ai_service.py"
      - "app.py"
      - "tests/test_core_mesh.py"
      - "tests/test_unknown_learning.py"
      - ".github/workflows/usect-two-ci.yml"
  pull_request:
    paths:
      - "core-two/**"
      - "ai/core_mesh.py"
      - "ai/orchestrator.py"
      - "services/ai_service.py"
      - "app.py"
      - "tests/test_core_mesh.py"
      - ".github/workflows/usect-two-ci.yml"

permissions:
  contents: read

jobs:
  core-two-go:
    name: Core-Two race tests, vet and command builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: core-two/go.mod
      - name: Test Core-Two with race detector and local Core-One/Core-Zero modules
        working-directory: core-two
        run: go test -race ./...
      - name: Vet Core-Two
        working-directory: core-two
        run: go vet ./...
      - name: Build all Core-Two commands
        working-directory: core-two
        run: go build ./cmd/...

  python-core-mesh:
    name: Python syntax and Core Mesh routing safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile integration modules
        run: python -m py_compile app.py ai/core_mesh.py ai/orchestrator.py ai/unknown_learning.py ai/worldwide_context.py ai/living_brain.py services/ai_service.py
      - name: Test Core Mesh routing and safety contracts
        run: python -m pytest -q tests/test_core_mesh.py tests/test_unknown_learning.py
