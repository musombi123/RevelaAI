name: USECT-UNCOPYABLE security tests

on:
  pull_request:
    paths:
      - "core_uncopyable/**"
      - "core_billing/licensing.py"
      - "mesh/rvx_mesh.py"
      - "revela_platform/fastapi_app.py"
      - "fastapi_routes/uncopyable.py"
      - "asgi.py"
      - "tests/test_usect_uncopyable.py"
      - ".github/workflows/usect-uncopyable.yml"
  push:
    branches: [main, usect-uncopyable]
    paths:
      - "core_uncopyable/**"
      - "core_billing/licensing.py"
      - "mesh/rvx_mesh.py"
      - "revela_platform/fastapi_app.py"
      - "fastapi_routes/uncopyable.py"
      - "asgi.py"
      - "tests/test_usect_uncopyable.py"
      - ".github/workflows/usect-uncopyable.yml"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install "cryptography>=42,<47" "PyJWT>=2.8" "pydantic>=2.7,<3" "fastapi>=0.115,<1" "pytest>=8,<9"
      - name: Compile trust-boundary modules
        run: python -m compileall -q core_uncopyable fastapi_routes/uncopyable.py core_billing/licensing.py mesh/rvx_mesh.py
      - name: Run USECT-UNCOPYABLE tests
        run: python -m pytest -q tests/test_usect_uncopyable.py
