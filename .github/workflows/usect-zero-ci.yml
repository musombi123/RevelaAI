name: USECT-ZERO Core and Backend Adapter

on:
  push:
    paths:
      - "core-zero/**"
      - "routes/usect_zero_routes.py"
      - "services/usect_zero_client.py"
      - "ai/usect_zero_tools.py"
      - "services/ai_service.py"
      - "tests/test_usect_zero_backend.py"
      - "tests/test_usect_zero_brain_tool.py"
      - "app.py"
      - ".github/workflows/usect-zero-ci.yml"
  pull_request:
    paths:
      - "core-zero/**"
      - "routes/usect_zero_routes.py"
      - "services/usect_zero_client.py"
      - "ai/usect_zero_tools.py"
      - "services/ai_service.py"
      - "tests/test_usect_zero_backend.py"
      - "tests/test_usect_zero_brain_tool.py"
      - "app.py"
      - ".github/workflows/usect-zero-ci.yml"

permissions:
  contents: read

jobs:
  go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: core-zero/go.mod
      - name: Test core
        working-directory: core-zero
        run: go test ./...
      - name: Vet core
        working-directory: core-zero
        run: go vet ./...
      - name: Build core
        working-directory: core-zero
        run: go build -o /tmp/usect-zero ./cmd/usect-zero

  python-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install adapter test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run adapter and brain-tool tests
        run: python -m pytest -q tests/test_usect_zero_backend.py tests/test_usect_zero_brain_tool.py
