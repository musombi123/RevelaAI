name: RevelaAI Python Platform Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  rvx-and-license-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade fastapi "uvicorn[standard]" pydantic "SQLAlchemy>=2.0,<3" "cryptography>=42,<47" "PyJWT>=2.8" "httpx>=0.27" "pytest>=8,<10"
      - name: Compile all new Python modules
        run: python -m compileall -q rvx recipe mesh core_billing core_meter marketplace revela_platform core_foundry core_seed core_auditor
      - name: Run RVX, key, license, Foundry, Seed and Auditor tests
        run: python -m pytest -q tests/test_revela_security.py
