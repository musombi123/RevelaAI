name: FastAPI Gateway Migration Checks

on:
  pull_request:
    paths:
      - "asgi.py"
      - "app.py"
      - "requirements.txt"
      - "render.yaml"
      - "revela_platform/**"
      - "routes/**"
      - "fastapi_routes/**"
      - "services/**"
      - "tests/test_fastapi_entrypoint.py"
      - ".github/workflows/fastapi-migration.yml"
  push:
    branches: [migration/flask-to-fastapi, migration/fastapi-shared-routes]
    paths:
      - "asgi.py"
      - "app.py"
      - "requirements.txt"
      - "render.yaml"
      - "revela_platform/**"
      - "routes/**"
      - "fastapi_routes/**"
      - "services/**"
      - "tests/test_fastapi_entrypoint.py"
      - ".github/workflows/fastapi-migration.yml"

permissions:
  contents: read

jobs:
  asgi-entrypoint:
    name: Native FastAPI entry point and route contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install gateway and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile ASGI entry point and tests
        run: python -m py_compile app.py asgi.py tests/test_fastapi_entrypoint.py
      - name: Reject Flask and WSGI runtime dependencies
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import re

          app_source = Path("app.py").read_text(encoding="utf-8")
          asgi_source = Path("asgi.py").read_text(encoding="utf-8")
          platform_source = Path("revela_platform/fastapi_app.py").read_text(encoding="utf-8")
          requirements = Path("requirements.txt").read_text(encoding="utf-8").lower()

          assert "from asgi import app" in app_source
          assert "WSGIMiddleware" not in asgi_source
          assert "legacy_flask_app" not in asgi_source
          assert not Path("legacy_flask_app.py").exists()
          assert "from asgi import app as revelaai_app" in platform_source
          assert "app.mount(\"/\", revelaai_app" in platform_source
          assert "WSGIMiddleware" not in platform_source

          for filename, source in (("app.py", app_source), ("asgi.py", asgi_source), ("revela_platform/fastapi_app.py", platform_source)):
              tree = ast.parse(source, filename=filename)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      assert all(alias.name.split(".")[0].lower() != "flask" for alias in node.names), filename
                  elif isinstance(node, ast.ImportFrom):
                      module = (node.module or "").lower()
                      assert module != "flask" and not module.startswith("flask."), filename

          forbidden = {"flask", "flask-cors", "a2wsgi", "werkzeug"}
          for line in requirements.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              match = re.match(r"^([a-zA-Z0-9_.-]+)", stripped)
              if match:
                  package = match.group(1).replace("_", "-").lower()
                  assert package not in forbidden, package

          print("FastAPI-only runtime contract verified.")
          PY
      - name: Run FastAPI gateway regression tests
        run: python -m pytest -q tests/test_fastapi_entrypoint.py
