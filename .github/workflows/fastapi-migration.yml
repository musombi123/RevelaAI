name: FastAPI Gateway Migration Checks

on:
  pull_request:
    paths:
      - "app.py"
      - "asgi.py"
      - "requirements.txt"
      - "render.yaml"
      - "fastapi_routes/**"
      - "services/**"
      - "revelai/sci_core/**"
      - "tests/test_fastapi_entrypoint.py"
      - ".github/workflows/fastapi-migration.yml"
  push:
    branches: [main, migration/fastapi-only-runtime]
    paths:
      - "app.py"
      - "asgi.py"
      - "requirements.txt"
      - "render.yaml"
      - "fastapi_routes/**"
      - "services/**"
      - "revelai/sci_core/**"
      - "tests/test_fastapi_entrypoint.py"
      - ".github/workflows/fastapi-migration.yml"

permissions:
  contents: read

jobs:
  asgi-entrypoint:
    name: Native FastAPI only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install gateway and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile native application and tests
        run: python -m py_compile app.py asgi.py tests/test_fastapi_entrypoint.py
      - name: Reject Flask and WSGI runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import re

          app_source = Path("app.py").read_text(encoding="utf-8")
          asgi_source = Path("asgi.py").read_text(encoding="utf-8")
          platform_source = Path("revela_platform/fastapi_app.py").read_text(encoding="utf-8")
          requirements = Path("requirements.txt").read_text(encoding="utf-8").lower()

          def has_flask_import(source):
              return bool(re.search(
                  r"^\s*(?:from\s+flask(?:\.[\w.]+)?\s+import|import\s+flask(?:\s|,|$))",
                  source,
                  re.MULTILINE,
              ))

          assert "from asgi import app" in app_source
          assert "WSGIMiddleware" not in asgi_source
          assert "legacy_flask_app" not in asgi_source
          assert not has_flask_import(asgi_source)
          assert not has_flask_import(app_source)
          assert "WSGIMiddleware" not in platform_source
          assert "from asgi import app as revelaai_app" in platform_source
          assert "app.mount(\"/\", revelaai_app" in platform_source
          assert not has_flask_import(platform_source)
          assert importlib.util.find_spec("flask") is None, "Flask must not be installed"

          requirement_lines = [
              line.strip() for line in requirements.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          for dependency in ("flask", "flask-cors", "a2wsgi"):
              assert not any(
                  line == dependency or line.startswith((
                      dependency + " ", dependency + "<", dependency + ">",
                      dependency + "=", dependency + "[", dependency + "~",
                      dependency + "!", dependency + ";",
                  ))
                  for line in requirement_lines
              ), dependency

          assert not Path("legacy_flask_app.py").exists()
          for source in Path(".").rglob("*.py"):
              if ".git" in source.parts or ".venv" in source.parts or "venv" in source.parts:
                  continue
              code = source.read_text(encoding="utf-8")
              assert not has_flask_import(code), f"Flask import remains in {source}"
          print("No Flask app, runtime import, or Flask dependency remains.")
          PY
      - name: Run FastAPI gateway regression tests
        run: python -m pytest -q tests/test_fastapi_entrypoint.py
