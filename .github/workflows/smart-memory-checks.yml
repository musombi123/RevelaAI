name: RevelaAI smart memory checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/memory-v2-coordinated-ai-team", "feat/smart-memory-gemini-wiring"]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend modules
        run: python -m py_compile app.py asgi.py fastapi_routes/chat.py fastapi_routes/memory.py services/memory_store.py ai/living_brain.py ai/global_brain_adapter.py ai/hub_prompts.py
      - name: Install memory-route test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify userId header is bound to signed identity
        env:
          JWT_SECRET: "test-only-secret"
        run: python -m unittest discover -s tests -p "test_identity_header.py"
      - name: Verify global brain adapter
        run: python -m unittest discover -s tests -p "test_global_brain_adapter.py"
      - name: Verify hub routing and identity prompts
        run: python -m unittest discover -s tests -p "test_hub_prompts.py"
      - name: Verify Gemini primary and model fallback routing
        run: python -m unittest discover -s tests -p "test_gemini_routing.py"
      - name: Verify database separation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("config/db.py").read_text(encoding="utf-8")
          assert 'db = client["revelai"]' in source
          assert 'db["conversations"]' in source
          assert 'db["memories"]' in source
          assert 'db["ideas"]' in source
          assert 'db["learnings"]' in source
          assert 'users_col' not in source
          print("RevelaAI uses its own canonical database and collections.")
          PY
      - name: Verify smart filter rules
        env:
          JWT_SECRET: "test-only-secret"
        run: |
          python - <<'PY'
          from services.memory_store import isBestThing

          assert not isBestThing("hi")
          assert not isBestThing("thanks")
          assert not isBestThing("ok")
          assert isBestThing("My farm grows maize in Kilifi")
          assert isBestThing("I want to build a school fee calculator")
          assert isBestThing("Mombasa Kenya")
          assert isBestThing("No Groq")
          assert not isBestThing("very nice")
          assert not isBestThing("I want to build a school fee calculator", [
              "I want to build a school fee calculator"
          ])
          print("Smart memory filter checks passed.")
          PY
