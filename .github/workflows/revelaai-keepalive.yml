name: RevelaAI Keepalive

on:
  schedule:
    # Run well inside Render's free-service idle window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# This workflow only makes an HTTPS health request; it needs no repository access.
permissions: {}

concurrency:
  group: revelaai-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Verify the live RevelaAI ASGI process
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping and validate process health
        shell: bash
        env:
          HEALTH_URL: https://revelaai.onrender.com/_fastapi/health
        run: |
          set -Eeuo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            echo "RevelaAI process health check (attempt ${attempt}/3)"

            if curl \
              --silent --show-error --fail \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 20 \
              --request GET \
              --header "Accept: application/json" \
              --header "Cache-Control: no-cache" \
              --header "User-Agent: RevelaAI-Keepalive/1.1" \
              --output "$response_file" \
              "$HEALTH_URL" \
              && jq -e '
                .status == "ok"
                and .service == "revelaai"
                and .runtime == "fastapi"
              ' "$response_file" >/dev/null; then
              echo "RevelaAI ASGI process is healthy."
              jq -c '{status, service, runtime, build_id}' "$response_file"
              exit 0
            fi

            echo "::warning::Health check attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "::error::RevelaAI failed its process health check after 3 attempts."
          exit 1
