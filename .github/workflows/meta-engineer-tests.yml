name: Meta-Engineer safety tests

on:
  push:
    branches: [main, feat/autonomous-meta-engineer]
  pull_request:
    branches: [main]

jobs:
  meta-engineer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest psutil pymongo flask requests
      - name: Compile Meta-Engineer modules
        run: python -m compileall -q meta_engineer routes/meta_engineer_routes.py revelai/sci_core revelai/routers/sci_core.py revelai/core/agi_manifest.py revelai/core/brain_os.py revelai/routers/agi_router.py tests/test_meta_engineer.py tests/test_sci_core.py tests/test_agi_manifest.py tests/test_brain_os.py
      - name: Run Meta-Engineer tests
        run: python -m pytest -q tests/test_meta_engineer.py tests/test_sci_core.py tests/test_agi_manifest.py tests/test_brain_os.py
