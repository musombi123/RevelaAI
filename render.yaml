services:
  # Public FastAPI ASGI gateway. All active HTTP routes are native ASGI routers.
  # No Flask application or WSGI bridge is started by this service.
  # Core credentials are imported server-to-server; no core token is browser-facing.
  - type: web
    name: RevelaAI
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: REVELAAI_TEXT_PROVIDERS
        value: "gemini,hf,mvi"
      # Authoritative platform-admin verifier used by routes/meta_engineer_routes.py.
      # Keep this server-side; bearer JWTs are never sent to the Go core.
      - key: REVELACODE_BACKEND_URL
        value: "https://revelacode-backend.onrender.com"
      - key: REVELACODE_ADMIN_VERIFY_TIMEOUT_SECONDS
        value: "15"
      - key: USECT_ZERO_ENABLED
        value: "true"
      - key: USECT_ZERO_URL
        fromService:
          type: pserv
          name: usect-zero-core
          property: hostport
      - key: USECT_ZERO_BASE_URL
        fromService:
          type: pserv
          name: usect-zero-core
          property: hostport
      - key: USECT_ZERO_ADMIN_TOKEN
        fromService:
          type: pserv
          name: usect-zero-core
          envVarKey: USECT_ZERO_ADMIN_TOKEN
      - key: GENESIS_BASE_URL
        fromService:
          type: pserv
          name: genesis-core-one
          property: hostport
      - key: GENESIS_ADMIN_TOKEN
        fromService:
          type: pserv
          name: genesis-core-one
          envVarKey: GENESIS_ADMIN_TOKEN
      - key: GENESIS_ORCHESTRATOR_TOOLS_ENABLED
        value: "true"
      # User IDs authorized to explicitly approve Tier 1-2 Genesis activation/rollback.
      - key: GENESIS_OWNER_USER_IDS
        sync: false
      # These server-only credentials are used only by authenticated operator routes.
      - key: GENESIS_OWNER_APPROVAL_TOKEN
        fromService:
          type: pserv
          name: genesis-core-one
          envVarKey: GENESIS_OWNER_APPROVAL_TOKEN
      - key: GENESIS_ACTION_APPROVAL_TOKEN
        fromService:
          type: pserv
          name: genesis-core-one
          envVarKey: GENESIS_ACTION_APPROVAL_TOKEN
      - key: MIND_BASE_URL
        fromService:
          type: pserv
          name: infinite-mind-core
          property: hostport
      - key: MIND_ADMIN_TOKEN
        fromService:
          type: pserv
          name: infinite-mind-core
          envVarKey: MIND_ADMIN_TOKEN

  # Optional supervisor probe targets may be configured in the Render dashboard:
  # USECT_ZERO_GATEWAY_URL, GENESIS_BASE_URL, MIND_BASE_URL.
  # They are intentionally not required at service startup.
  # Core-Zero: model-free diagnostics, bounded tools, and human-gated recovery.
  # Render private services use TCP health checks; /v1/health remains available
  # to authenticated internal probes and the optional supervisor.
  - type: pserv
    name: usect-zero-core
    runtime: go
    rootDir: core-zero
    plan: starter
    buildCommand: go build -o ./usect-zero ./cmd/usect-zero
    startCommand: ./usect-zero -mode serve -root .. -listen 0.0.0.0:$PORT
    disk:
      name: usect-zero-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: USECT_ZERO_DATA_DIR
        value: /var/data/usect-zero
      - key: USECT_ZERO_ADMIN_TOKEN
        generateValue: true
  # Core-One: standalone Genesis service. Build from the repository root so
  # sibling-module replacements (core-zero/core-one/lib/worldwide) remain visible.
  - type: pserv
    name: genesis-core-one
    runtime: go
    plan: starter
    buildCommand: go -C core-one build -o ./genesis-server ./cmd/genesis
    startCommand: ./core-one/genesis-server -mode serve -repo-root . -listen 0.0.0.0:$PORT -interval 60s
    disk:
      name: genesis-core-one-data
      mountPath: /var/data/genesis
      sizeGB: 1
    envVars:
      - key: GENESIS_REGISTRY_DIR
        value: /var/data/genesis/tool-registry
      - key: GENESIS_ADMIN_TOKEN
        generateValue: true
      # Render terminates public TLS at the platform proxy; this is a private service.
      - key: GENESIS_TRUST_PROXY_TLS
        value: "true"
      - key: GENESIS_SIGNING_KEY
        sync: false
      - key: GENESIS_OWNER_APPROVAL_TOKEN
        sync: false
      - key: GENESIS_ACTION_APPROVAL_TOKEN
        sync: false
      - key: GENESIS_MODEL_BASE_URL
        sync: false
      - key: GENESIS_MODEL_NAME
        sync: false
      - key: GENESIS_MODEL_API_KEY
        sync: false
      - key: GENESIS_OFFLINE
        value: "true"

  # Core-Two: standalone Infinite Mind service. Its sibling-module imports
  # require the full repository checkout to remain the build/runtime root.
  - type: pserv
    name: infinite-mind-core
    runtime: go
    plan: starter
    buildCommand: go -C core-two build -o ./revela-mind ./cmd/revela-mind
    startCommand: ./core-two/revela-mind -daemon -repo-root . -listen 0.0.0.0:$PORT -interval 24h
    envVars:
      - key: MIND_ADMIN_TOKEN
        generateValue: true
      - key: USECT_ZERO_BASE_URL
        fromService:
          type: pserv
          name: usect-zero-core
          property: hostport
      - key: USECT_ZERO_ADMIN_TOKEN
        fromService:
          type: pserv
          name: usect-zero-core
          envVarKey: USECT_ZERO_ADMIN_TOKEN
      - key: GENESIS_BASE_URL
        fromService:
          type: pserv
          name: genesis-core-one
          property: hostport
      - key: GENESIS_ADMIN_TOKEN
        fromService:
          type: pserv
          name: genesis-core-one
          envVarKey: GENESIS_ADMIN_TOKEN
