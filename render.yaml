services:
  # Public FastAPI ASGI gateway. All active HTTP routes are native ASGI routers.
  # No Flask application or WSGI bridge is started by this service.
  # Core credentials are imported server-to-server; no core token is browser-facing.
  - type: web
    name: RevelaAI
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn revela_platform.fastapi_app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      # Explicit allow-list for the web frontend and native WebView clients.
      - key: CORS_ORIGINS
        value: "https://revelacode.co.ke,https://www.revelacode.co.ke,https://revelacode-frontend.onrender.com,http://tauri.localhost,https://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"
      - key: REVELAAI_TEXT_PROVIDERS
        value: "gemini,hf,mvi"
      - key: REVELAAI_DAILY_LEARNING_ENABLED
        value: "true"
      # Authoritative platform-admin verifier used by routes/meta_engineer_routes.py.
      # Keep this server-side; bearer JWTs are never sent to the Go core.
      - key: REVELACODE_BACKEND_URL
        value: "https://revelacode-backend.onrender.com"
      # Persistent platform data (licenses, factories, billing and usage) needs PostgreSQL.
      # If unset, the code falls back to local SQLite, which is not durable across ephemeral redeploys.
      - key: REVELA_DATABASE_URL
        sync: false
      # Smart Memory stores in the separate 'revelai' MongoDB database.
      - key: MONGO_URI
        sync: false
      # Must match the shared secret configured in RevelaCode-Backend for user verification.
      - key: REVELAAI_SERVICE_KEY
        sync: false
      # Model-provider secret remains server-side; the API base URL has a safe source default.
      - key: GEMINI_API_KEY
        sync: false
      # Pollinations is the existing image provider. Its secret key stays on the server.
      - key: POLLINATIONS_API_KEY
        sync: false
      # Higher-quality illustration/background model; designs still render exact copy locally.
      - key: POLLINATIONS_IMAGE_MODEL
        value: "google/gemini-3-pro-image"
      # Same provider fallback, used only if the primary model fails.
      - key: POLLINATIONS_IMAGE_FALLBACK_MODEL
        value: "flux"
      - key: POLLINATIONS_IMAGE_TIMEOUT
        value: "180"
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_FALLBACK_MODEL
        value: "gemini-3.5-flash-lite"
      # Same license-signing keypair used across all license issuers/verifiers in this platform.
      - key: REVELA_LICENSE_PRIVATE_KEY
        sync: false
      - key: REVELA_LICENSE_PUBLIC_KEY
        sync: false
      # Shared within this service for guarded organ/security administration; never expose in the browser.
      - key: REVELA_ORGAN_ADMIN_TOKEN
        generateValue: true
      # Must exactly match the JWT signing secret used by RevelaCode-Backend.
      # Keep it server-side; never place this value in Vite/frontend variables.
      - key: JWT_SECRET
        sync: false
      # Comma-separated canonical RevelaCode user IDs permitted to operate Core Mesh.
      - key: CORE_MESH_ADMIN_USER_IDS
        sync: false
      - key: REVELACODE_ADMIN_VERIFY_TIMEOUT_SECONDS
        value: "15"
      # Keep the gateway adapter and dashboard/proxy origins identical.
      - key: USECT_ZERO_ENABLED
        value: "true"
      - key: USECT_ZERO_URL
        fromService:
          type: web
          name: usect-zero-core-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: USECT_ZERO_BASE_URL
        fromService:
          type: web
          name: usect-zero-core-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: USECT_ZERO_ADMIN_TOKEN
        fromService:
          type: web
          name: usect-zero-core-free
          envVarKey: USECT_ZERO_ADMIN_TOKEN
      # Generated on the private core and linked here automatically. This identity is
      # restricted to the brain's read/proposal scopes and is never an admin credential.
      - key: USECT_ZERO_BRAIN_TOKEN
        fromService:
          type: web
          name: usect-zero-core-free
          envVarKey: USECT_ZERO_BRAIN_TOKEN
      - key: GENESIS_BASE_URL
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: GENESIS_ADMIN_TOKEN
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: GENESIS_ADMIN_TOKEN
      - key: GENESIS_ORCHESTRATOR_TOOLS_ENABLED
        value: "true"
      # User IDs authorized to explicitly approve Tier 1-2 Genesis activation/rollback.
      - key: GENESIS_OWNER_USER_IDS
        sync: false
      # These server-only credentials are used only by authenticated operator routes.
      - key: GENESIS_OWNER_APPROVAL_TOKEN
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: GENESIS_OWNER_APPROVAL_TOKEN
      - key: GENESIS_ACTION_APPROVAL_TOKEN
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: GENESIS_ACTION_APPROVAL_TOKEN
      - key: MIND_BASE_URL
        fromService:
          type: web
          name: infinite-mind-core-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: MIND_ADMIN_TOKEN
        fromService:
          type: web
          name: infinite-mind-core-free
          envVarKey: MIND_ADMIN_TOKEN

  # Core services are free Render web services. Render assigns their HTTPS URLs;
  # the Blueprint links RENDER_EXTERNAL_URL automatically so no URL is pasted
  # into the Dashboard. Their APIs still require their existing service tokens.
  # Free web services sleep when idle and have ephemeral filesystems (no disks).
  - type: web
    name: usect-zero-core-free
    runtime: go
    rootDir: core-zero
    plan: free
    buildCommand: go build -o ./usect-zero ./cmd/usect-zero
    startCommand: ./usect-zero -mode serve -root .. -listen 0.0.0.0:$PORT
    envVars:
      - key: USECT_ZERO_DATA_DIR
        value: ./.revela-state/usect-zero
      - key: USECT_ZERO_ADMIN_TOKEN
        generateValue: true
      # Separate generated service identity for bounded RevelaAI brain operations.
      - key: USECT_ZERO_BRAIN_TOKEN
        generateValue: true
      # Optional supervisor probes use Blueprint-assigned HTTPS URLs.
      - key: USECT_ZERO_GATEWAY_URL
        fromService:
          type: web
          name: RevelaAI
          envVarKey: RENDER_EXTERNAL_URL
      - key: GENESIS_BASE_URL
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: MIND_BASE_URL
        fromService:
          type: web
          name: infinite-mind-core-free
          envVarKey: RENDER_EXTERNAL_URL
  # Core-One: standalone Genesis service. Build from the repository root so
  # sibling-module replacements (core-zero/core-one/lib/worldwide) remain visible.
  - type: web
    name: genesis-core-one-free
    runtime: go
    plan: free
    buildCommand: go -C core-one build -o ./genesis-server ./cmd/genesis
    startCommand: ./core-one/genesis-server -mode serve -repo-root . -listen 0.0.0.0:$PORT -interval 60s
    envVars:
      - key: GENESIS_REGISTRY_DIR
        value: ./.revela-state/genesis/tool-registry
      - key: GENESIS_ADMIN_TOKEN
        generateValue: true
      # Render terminates public TLS; gateway-to-core calls use the assigned HTTPS URL.
      - key: GENESIS_TRUST_PROXY_TLS
        value: "true"
      # Must be a base64-encoded Ed25519 32-byte seed or 64-byte private key.
      # Render's generic generateValue is not guaranteed to produce valid key material.
      - key: GENESIS_SIGNING_KEY
        sync: false
      - key: GENESIS_OWNER_APPROVAL_TOKEN
        sync: false
      - key: GENESIS_ACTION_APPROVAL_TOKEN
        sync: false
      - key: GENESIS_MODEL_BASE_URL
        sync: false
      - key: GENESIS_MODEL_NAME
        sync: false
      - key: GENESIS_MODEL_API_KEY
        sync: false
      - key: GENESIS_OFFLINE
        value: "true"

  # Core-Two: standalone Infinite Mind service. Its sibling-module imports
  # require the full repository checkout to remain the build/runtime root.
  - type: web
    name: infinite-mind-core-free
    runtime: go
    plan: free
    buildCommand: go -C core-two build -o ./revela-mind ./cmd/revela-mind
    startCommand: ./core-two/revela-mind -daemon -repo-root . -listen 0.0.0.0:$PORT -interval 24h
    envVars:
      - key: MIND_ADMIN_TOKEN
        generateValue: true
      - key: USECT_ZERO_BASE_URL
        fromService:
          type: web
          name: usect-zero-core-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: USECT_ZERO_ADMIN_TOKEN
        fromService:
          type: web
          name: usect-zero-core-free
          envVarKey: USECT_ZERO_ADMIN_TOKEN
      - key: GENESIS_BASE_URL
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: RENDER_EXTERNAL_URL
      - key: GENESIS_ADMIN_TOKEN
        fromService:
          type: web
          name: genesis-core-one-free
          envVarKey: GENESIS_ADMIN_TOKEN
      # Optional provider credential; Mind remains model-free without it.
      - key: REVELACODE_PROVIDER_KEY
        sync: false
