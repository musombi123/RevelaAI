openapi: 3.1.0
info:
  title: Revela Infinite Mind Integrated Gateway
  version: 0.2.0
  summary: Additive API contract for Core-Zero, Core-One, and Core-Two.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  description: >
    Core-Two routes are implemented by Infinite Mind. Core-One and Core-Zero
    routes are namespaced proxies. Mind only recommends changes; it never merges
    code, actuates hardware, or executes submitted candidate source.
servers:
  - url: http://127.0.0.1:8782
    description: Local development. Public deployment requires TLS and rate limiting.
security: []
tags:
  - name: mind
    description: Read-only observations, Guardian-gated proposals, telemetry and canary recommendations.
  - name: zero
    description: Namespaced proxy routes to existing Core-Zero endpoints.
  - name: genesis
    description: Namespaced proxy routes to existing Core-One endpoints.
paths:
  /v1/mind/health:
    get:
      tags: [mind]
      operationId: getMindHealth
      summary: Check Mind and core integration status
      responses:
        '200':
          description: Health and integration state; secrets are never returned.
  /v1/mind/metrics:
    get:
      tags: [mind]
      operationId: getMindMetrics
      summary: Observe repository evidence and recorded telemetry
      responses:
        '200':
          description: Evidence-backed operational metrics; unknown production values remain null.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/mind/evolve:
    post:
      tags: [mind]
      operationId: proposeMindEvolution
      summary: Run guarded deterministic candidate evaluation and stage a review-only proposal
      description: This action fails closed without MIND_ADMIN_TOKEN. It never merges code or changes Core-One/Core-Zero files.
      security:
        - MindToken: []
        - MindHeaderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_name, objective]
              additionalProperties: false
              properties:
                tool_name:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                objective:
                  type: string
                  minLength: 3
                  maxLength: 4096
                reason:
                  type: string
                  maxLength: 2048
      responses:
        '202':
          description: Review-only evolution proposal.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Core-Two or Core-One Guardian blocked the request.
        '422':
          description: No candidate passed qualification.
  /v1/mind/evolutions:
    get:
      tags: [mind]
      operationId: listMindEvolutions
      summary: List proposals and recorded evidence
      responses:
        '200':
          description: Proposals awaiting human review; no merge is performed.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/mind/learning:
    get:
      tags: [mind]
      operationId: getMindLearning
      summary: Read human feedback and recorded canary outcomes
      responses:
        '200':
          description: Ranking evidence; neither feedback nor canary results bypass tests or Guardian.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/mind/feedback:
    post:
      tags: [mind]
      operationId: recordMindFeedback
      summary: Record a human decision about a staged evolution or scored candidate
      security:
        - MindToken: []
        - MindHeaderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_name, mutation, outcome, note]
              additionalProperties: false
              properties:
                version:
                  type: string
                  pattern: '^v0\.1\.[0-9]+$'
                candidate_id:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                tool_name:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                mutation:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                outcome:
                  type: string
                  enum: [merged, rejected, reverted, needs_work]
                note:
                  type: string
                  minLength: 8
                  maxLength: 1200
                evidence_ref:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Human decision recorded for ranking; no source files merged.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Feedback does not match a staged evolution or scored candidate.
  /v1/mind/telemetry/events:
    post:
      tags: [mind]
      operationId: recordToolTelemetry
      summary: Record bounded tool execution telemetry without user content
      security:
        - MindToken: []
        - MindHeaderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolTelemetryEvent'
      responses:
        '201':
          description: Operational event recorded; request content is not accepted or stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Event fails schema or validation.
  /v1/mind/candidates:
    post:
      tags: [mind]
      operationId: scoreFoundryCandidate
      summary: Guardian-gate a sandbox-tested Core-One Foundry candidate and score recorded telemetry
      description: Mind accepts candidate metadata, hashes and evidence references only. It never writes or executes candidate source.
      security:
        - MindToken: []
        - MindHeaderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundryCandidate'
      responses:
        '200':
          description: Canary recommendation with evidence; promotion and rollback are not executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateScoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Mind or Core-One Guardian blocked the candidate before scoring.
        '422':
          description: Candidate metadata or evidence is invalid.
  /v1/mind/tools/{name}/improvement:
    get:
      tags: [mind]
      operationId: getToolImprovement
      summary: Read per-tool, per-version telemetry and improvement metrics
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
      responses:
        '200':
          description: Provenance-aware improvement metrics.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No metrics have been recorded for this tool.
  /v1/mind/stream:
    get:
      tags: [mind]
      operationId: streamMindStatus
      summary: Stream periodic Mind and integration status as server-sent events
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
  /v1/mind/key:
    get:
      tags: [mind]
      operationId: getMindProviderKeyStatus
      summary: Read shared provider configuration status without disclosing credentials
      responses:
        '200':
          description: Reports whether provider environment variables are configured.
    post:
      tags: [mind]
      operationId: requestMindProviderKey
      summary: Submit a key access request for human review; no secret is issued
      security:
        - MindToken: []
        - MindHeaderToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, reason]
              additionalProperties: false
              properties:
                client_id:
                  type: string
                  maxLength: 120
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '202':
          description: Request queued for human approval.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/zero/status:
    get:
      tags: [zero]
      operationId: getZeroIntegrationStatus
      summary: Read combined Core-Zero integration status
      responses:
        '200':
          description: Status observation.
  /v1/zero/health:
    get:
      tags: [zero]
      operationId: proxyZeroHealth
      summary: Proxy Core-Zero health
      responses:
        '200':
          description: Existing Core-Zero health payload.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/scan:
    get:
      security:
        - ZeroAPIKey: []
      tags: [zero]
      operationId: proxyZeroScan
      summary: Proxy Core-Zero evidence scan
      responses:
        '200':
          description: Existing Core-Zero scan result.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/keys/request:
    post:
      tags: [zero]
      operationId: proxyZeroKeyRequest
      summary: Proxy a Core-Zero key request
      security:
        - MindToken: []
          ZeroAPIKey: []
        - MindHeaderToken: []
          ZeroAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/keys/requests:
    get:
      security:
        - ZeroAdminToken: []
      tags: [zero]
      operationId: proxyZeroKeyRequests
      summary: Proxy the Core-Zero pending key request list
      responses:
        '200':
          description: Existing Core-Zero response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/keys/requests/{request_id}/approve:
    post:
      tags: [zero]
      operationId: approveZeroKeyRequest
      summary: Proxy a key approval request to Core-Zero
      security:
        - MindToken: []
          ZeroAdminToken: []
        - MindHeaderToken: []
          ZeroAdminToken: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/keys/issued/{key_id}/revoke:
    post:
      tags: [zero]
      operationId: revokeZeroKey
      summary: Proxy key revocation to Core-Zero
      security:
        - MindToken: []
          ZeroAdminToken: []
        - MindHeaderToken: []
          ZeroAdminToken: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/heal/baseline:
    get:
      security:
        - ZeroAPIKey: []
      tags: [zero]
      operationId: proxyZeroHealingBaseline
      summary: Read the Core-Zero healing baseline
      responses:
        '200':
          description: Existing Core-Zero response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/heal/proposals:
    get:
      security:
        - ZeroAPIKey: []
      tags: [zero]
      operationId: proxyZeroHealingProposals
      summary: Read Core-Zero healing proposals
      responses:
        '200':
          description: Existing Core-Zero response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/heal/proposals/{proposal_id}/approve:
    post:
      tags: [zero]
      operationId: approveZeroHealingProposal
      summary: Proxy proposal approval to Core-Zero
      security:
        - MindToken: []
          ZeroAdminToken: []
        - MindHeaderToken: []
          ZeroAdminToken: []
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/assemble/templates:
    get:
      security:
        - ZeroAPIKey: []
      tags: [zero]
      operationId: proxyZeroAssemblyTemplates
      summary: List Core-Zero assembly templates
      responses:
        '200':
          description: Existing Core-Zero response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/assemble:
    post:
      tags: [zero]
      operationId: proxyZeroAssembly
      summary: Proxy a guarded assembly request to Core-Zero
      security:
        - MindToken: []
          ZeroAPIKey: []
        - MindHeaderToken: []
          ZeroAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/radar/compare:
    post:
      tags: [zero]
      operationId: proxyZeroRadarCompare
      summary: Proxy a comparison request to Core-Zero
      security:
        - MindToken: []
          ZeroAPIKey: []
        - MindHeaderToken: []
          ZeroAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/bridge/plan:
    post:
      tags: [zero]
      operationId: proxyZeroBridgePlan
      summary: Proxy a bridge planning request to Core-Zero
      security:
        - MindToken: []
          ZeroAPIKey: []
        - MindHeaderToken: []
          ZeroAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/mind/compile:
    post:
      tags: [zero]
      operationId: proxyZeroRVXCompile
      summary: Proxy the existing Core-Zero RVX compile endpoint
      security:
        - MindToken: []
          ZeroAPIKey: []
        - MindHeaderToken: []
          ZeroAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Existing Core-Zero response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/zero/mind/ide:
    get:
      security:
        - ZeroAPIKey: []
      tags: [zero]
      operationId: proxyZeroMindIDE
      summary: Proxy the Core-Zero IDE endpoint
      responses:
        '200':
          description: Existing Core-Zero response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/health:
    get:
      tags: [genesis]
      operationId: proxyGenesisHealth
      summary: Proxy the existing Core-One health endpoint
      responses:
        '200':
          description: Existing Core-One response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/invent:
    post:
      tags: [genesis]
      operationId: proxyGenesisInvent
      summary: Proxy a guarded invention proposal request to Core-One
      security:
        - MindToken: []
          GenesisToken: []
        - MindHeaderToken: []
          GenesisToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '202':
          description: Existing Core-One response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/queue:
    get:
      tags: [genesis]
      operationId: proxyGenesisQueue
      summary: Proxy the Core-One review queue
      security:
        - GenesisToken: []
      responses:
        '200':
          description: Existing Core-One response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/status:
    get:
      tags: [genesis]
      operationId: proxyGenesisStatus
      summary: Proxy Core-One service status
      security:
        - GenesisToken: []
      responses:
        '200':
          description: Existing Core-One response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/tools:
    get:
      tags: [genesis]
      operationId: proxyGenesisTools
      summary: Proxy the Core-One tool inventory
      security:
        - GenesisToken: []
      responses:
        '200':
          description: Existing Core-One response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/tools/{name}:
    get:
      tags: [genesis]
      operationId: proxyGenesisTool
      summary: Proxy a Core-One tool detail endpoint
      security:
        - GenesisToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Existing Core-One response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/tools/{name}/hardware_guide:
    get:
      tags: [genesis]
      operationId: proxyGenesisHardwareGuide
      summary: Proxy a Core-One hardware guide
      security:
        - GenesisToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Existing Core-One response.
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/stream:
    get:
      tags: [genesis]
      operationId: proxyGenesisStream
      summary: Proxy the Core-One server-sent event stream
      security:
        - GenesisToken: []
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: {type: string}
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/genesis/key:
    get:
      tags: [genesis]
      operationId: proxyGenesisKeyStatus
      summary: Read the Core-One shared provider-key status
      responses:
        '200':
          description: Existing Core-One response.
    post:
      tags: [genesis]
      operationId: proxyGenesisKeyRequest
      summary: Proxy a key access request to Core-One for human approval
      security:
        - MindToken: []
          GenesisToken: []
        - MindHeaderToken: []
          GenesisToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, reason]
              properties:
                client_id: {type: string, maxLength: 120}
                reason: {type: string, maxLength: 500}
      responses:
        '202':
          description: Existing Core-One response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/Unavailable'
  /v1/rvx/compile:
    post:
      tags: [genesis]
      operationId: proxyGenesisRVXCompile
      summary: Proxy the existing Core-One RVX compiler without replacing it
      security:
        - MindToken: []
          GenesisToken: []
        - MindHeaderToken: []
          GenesisToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              additionalProperties: false
              properties:
                source:
                  type: string
                  maxLength: 16384
      responses:
        '200':
          description: Existing declarative RVX response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Existing Core-One validation error.
components:
  securitySchemes:
    MindToken:
      type: http
      scheme: bearer
      bearerFormat: MIND_ADMIN_TOKEN
      description: Bearer form of the server-side Mind admin token.
    MindHeaderToken:
      type: apiKey
      in: header
      name: X-Mind-Token
      description: Alternate header accepted by Mind for authenticated mutations.
    GenesisToken:
      type: apiKey
      in: header
      name: X-Genesis-Token
      description: Existing Core-One service credential; required upstream for protected calls.
    ZeroAPIKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Existing approved scoped Core-Zero key.
    ZeroAdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Existing Core-Zero admin credential.
  responses:
    Unauthorized:
      description: Authentication requirement not satisfied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Local upstream or required evidence is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ToolTelemetryEvent:
      type: object
      additionalProperties: false
      required: [tool_name, version_hash, success, latency_ms, timestamp]
      properties:
        tool_name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        version_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        success:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
          maximum: 3600000
        error_class:
          type: string
          maxLength: 48
          pattern: '^[a-z0-9_-]*$'
        timestamp:
          type: string
          format: date-time
        sample_kind:
          type: string
          enum: [runtime, replay]
          default: runtime
    FoundryCandidate:
      type: object
      additionalProperties: false
      required: [candidate_id, source_core, tool_name, objective, baseline_version_hash, candidate_version_hash, source_sha256, risk_tier, sandbox_tested, sandbox_evidence_ref]
      properties:
        candidate_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        source_core:
          type: string
          const: core-one-foundry
        tool_name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        objective:
          type: string
          minLength: 3
          maxLength: 500
        baseline_version_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        candidate_version_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        source_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        risk_tier:
          type: integer
          enum: [1, 2]
        sandbox_tested:
          type: boolean
          const: true
        sandbox_evidence_ref:
          type: string
          minLength: 1
          maxLength: 500
    CandidateScoreResult:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [blocked, hold, promote, rollback]
        candidate_id:
          type: string
        tool_name:
          type: string
        guardian_passed:
          type: boolean
        core_one_guardian_passed:
          type: boolean
        scored:
          type: boolean
        score:
          type: number
        ranking_context_score:
          type: number
        canary:
          $ref: '#/components/schemas/CanaryDecision'
        evidence_recorded_at:
          type: string
          format: date-time
        evidence_path:
          type: string
        synthetic_fixture:
          type: boolean
          const: false
        production_verified:
          type: boolean
          const: false
        automatic_merge:
          type: boolean
          const: false
        promotion_executed:
          type: boolean
          const: false
        rollback_executed:
          type: boolean
          const: false
    CanaryDecision:
      type: object
      additionalProperties: false
      required: [decision, reason, minimum_sample_size, baseline, candidate, score, automatic_merge, auto_promotion_recommended]
      properties:
        decision:
          type: string
          enum: [promote, hold, rollback]
        reason:
          type: string
        minimum_sample_size:
          type: integer
        baseline:
          type: object
        candidate:
          type: object
        score:
          type: number
        automatic_merge:
          type: boolean
          const: false
        auto_promotion_recommended:
          type: boolean
    Error:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          const: error
        code:
          type: string
        message:
          type: string
