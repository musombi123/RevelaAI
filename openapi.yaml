openapi: 3.1.0
info:
  title: RevelaAI Platform and Living Brain API
  version: 1.1.0
  description: |
    Authenticated endpoints for submitting user-taught knowledge and retrieving
    human-reviewed shared learning. Born in Nairobi, Built for Worldwide.
servers:
  - url: https://revelaai.onrender.com
security:
  - RevelaCodeBearer: []
paths:
  /v1/learn/unknown:
    post:
      operationId: submitUnknownKnowledge
      summary: Submit a teaching packet for an unknown topic
      description: Notes are private by default. Explicit sharing consent may trigger a Genesis proposal, which must be reviewed and merged by a human.
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topic, steps]
              properties:
                topic:
                  type: string
                  minLength: 1
                  maxLength: 240
                steps:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: string
                    minLength: 1
                    maxLength: 500
                country:
                  type: string
                  default: KE
                language:
                  type: string
                  enum: [en, de, zh, ja, fr, es, sw]
                photo_hash:
                  type: string
                  pattern: '^[a-fA-F0-9]{64}$'
                  description: Optional SHA-256 reference; raw photo bytes are not accepted by this endpoint.
                source_request:
                  type: string
                  maxLength: 800
                consent_to_share:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Teaching saved; Genesis may be pending or await human merge.
        '400':
          description: Invalid submission.
        '401':
          description: Valid RevelaCode Bearer JWT required.
        '403':
          description: Guardian screening or sharing policy rejected the request.
        '503':
          description: Learning storage unavailable.
  /v1/learn/known:
    get:
      operationId: listKnownLearning
      summary: List explicitly shared, human-reviewed knowledge
      responses:
        '200':
          description: Published learning summaries without contributor identity.
        '401':
          description: Authentication required.
  /v1/learn/known/{topic_key}/publish:
    post:
      operationId: publishReviewedLearning
      summary: Publish knowledge after the operator attests the tool was reviewed and merged
      description: Restricted to IDs configured by CORE_MESH_ADMIN_USER_IDS or META_ENGINEER_ADMIN_USER_IDS. Publication may stage one Core-Two improvement proposal, which cannot merge automatically.
      parameters:
        - name: topic_key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,71}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool_name, endpoint, merge_commit]
              properties:
                tool_name:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                endpoint:
                  type: string
                  pattern: '^/v1/'
                  maxLength: 180
                merge_commit:
                  type: string
                  pattern: '^[a-fA-F0-9]{7,40}$'
      responses:
        '202':
          description: Published to shared learning and Mind proposal may await merge.
        '401':
          description: Authentication required.
        '403':
          description: Operator permission or explicit sharing consent missing.
        '422':
          description: Topic not ready or input validation failed.
  /v1/billing/plans:
    get:
      operationId: getBillingPlans
      summary: List USD platform plans and quotas
      responses:
        '200':
          description: Current plan catalogue
  /v1/billing/buy:
    post:
      operationId: createBillingCheckout
      summary: Create a Stripe subscription checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, country]
              properties:
                plan:
                  type: string
                  enum: [local, pro, enterprise]
                country:
                  type: string
                  default: KE
      responses:
        '202':
          description: Checkout created; no license until a verified payment webhook confirms settlement
        '401':
          description: Authentication required
        '503':
          description: Payment provider not configured
  /v1/billing/license/{intent_id}:
    get:
      operationId: retrievePaidLicense
      summary: Issue or rotate a license after confirmed payment
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signed platform license
        '409':
          description: Payment not confirmed
  /v1/billing/verify:
    get:
      operationId: verifyLicenseCompatibility
      deprecated: true
      summary: Verify a signed license (POST preferred; query strings may be logged)
      parameters:
        - name: license_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid or invalid license result
    post:
      operationId: verifyLicense
      summary: Verify a signed license without placing it in the URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key:
                  type: string
      responses:
        '200':
          description: Valid or invalid license result
  /v1/billing/webhooks/stripe:
    post:
      operationId: stripePaymentWebhook
      summary: Verify and process Stripe payment/subscription webhooks
      description: Requires a valid Stripe-Signature header; never trust the browser success redirect.
      responses:
        '200':
          description: Event accepted or already processed
        '400':
          description: Invalid webhook signature or event
  /v1/meter/usage:
    get:
      operationId: getMeterUsage
      summary: Get authenticated account usage by country and tool
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: country
          in: query
          required: false
          schema:
            type: string
            default: KE
      responses:
        '200':
          description: Usage totals and reviewed cost-savings only
        '403':
          description: Caller cannot view another account
  /v1/marketplace/search:
    get:
      operationId: searchGlobalMarketplace
      summary: Search reviewed tools with country BOM and language guide selection
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
            default: KE
        - name: industry
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Published tools and available localized assets
  /v1/marketplace/publish:
    post:
      operationId: submitMarketplaceTool
      summary: Submit a licensed tool for human review
      parameters:
        - name: X-Revela-License
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_id, name, description, endpoint, price_usd_cents]
              properties:
                tool_id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                endpoint:
                  type: string
                factory_build_id:
                  type: string
                  pattern: '^fab_[a-f0-9]{24}                  type: string
                  default: KE
                bom_by_country:
                  type: object
                guides_by_language:
                  type: object
      responses:
        '202':
          description: Listing saved as pending_review
        '402':
          description: Valid license required
  /v1/marketplace/buy:
    post:
      operationId: createMarketplaceCheckout
      summary: Create a one-time checkout for a reviewed listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_id, license_key, buyer_country]
              properties:
                tool_id:
                  type: string
                license_key:
                  type: string
                buyer_country:
                  type: string
                  default: KE
      responses:
        '202':
          description: Checkout created; delivery follows verified payment
        '402':
          description: Valid platform license required
        '503':
          description: Payment provider not configured
  /v1/marketplace/purchases/{purchase_id}:
    get:
      operationId: deliverMarketplacePurchase
      summary: Get the localized tool bundle after payment confirmation
      parameters:
        - name: purchase_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tool endpoint, available country BOM and guide
        '409':
          description: Payment not confirmed
  /v1/marketplace/earnings/me:
    get:
      operationId: getCreatorEarnings
      summary: Read creator earnings and pending payout balance
      responses:
        '200':
          description: Paid sales with creator/platform split; payouts may remain pending


  /v1/foundry/build:
    post:
      operationId: buildFactoryProposal
      summary: Build a licensed, reviewable factory manifest
      parameters:
        - name: X-Revela-License
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, requirements]
              properties:
                name:
                  type: string
                description:
                  type: string
                requirements:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                country:
                  type: string
                  default: KE
                language:
                  type: string
                  default: en
                industry:
                  type: string
                  default: general
                adapters:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Factory manifest staged for review; generated code is not executed
        '402':
          description: Valid license required
  /v1/foundry/builds/{build_id}:
    get:
      operationId: getFactoryProposal
      summary: Get an owned or reviewer-authorized factory manifest
      parameters:
        - name: build_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Manifest and current database review status
        '403':
          description: Not authorized to view this factory
  /v1/foundry/builds/{build_id}/review:
    post:
      operationId: reviewFactoryProposal
      summary: Approve or reject a factory proposal as an authorized reviewer
      parameters:
        - name: build_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, review_note]
              properties:
                approved:
                  type: boolean
                review_note:
                  type: string
      responses:
        '200':
          description: Review decision persisted to the manifest and audit trail
        '403':
          description: Reviewer permission required
  /v1/seed/{build_id}:
    post:
      operationId: seedOfflineFactoryChild
      summary: Seed a declarative child from an approved factory while honoring a signed offline lease
      parameters:
        - name: build_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Revela-License
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [child_name]
              properties:
                child_name:
                  type: string
                buyer_country:
                  type: string
                  default: KE
                purchase_id:
                  type: string
      responses:
        '201':
          description: Local declarative child bundle with signed lease; code execution remains disabled
        '402':
          description: Valid license required
        '409':
          description: Parent factory is not approved
  /v1/seed/{seed_id}/verify:
    get:
      operationId: verifyOfflineSeedLease
      summary: Check registered child lease status for the authenticated owner
      parameters:
        - name: seed_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registered offline authorization information
  /v1/auditor/verify:
    get:
      operationId: verifyAuditChain
      summary: Verify hash-chain consistency of audit ledger
      responses:
        '200':
          description: Ledger verification result and current head hash
        '403':
          description: Reviewer permission required
        '409':
          description: Corrupt audit ledger
  /v1/auditor/events:
    get:
      operationId: listAuditEvents
      summary: List own audit events or reviewer-authorized user events
      parameters:
        - name: actor_user_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Audit events with minimized details
        '403':
          description: Not authorized

components:
  securitySchemes:
    RevelaCodeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Country:
      name: country
      in: query
      required: false
      schema:
        type: string
        default: KE
      description: Backward-compatible Kenya default.
    Language:
      name: lang
      in: query
      required: false
      schema:
        type: string
        enum: [en, de, zh, ja, fr, es, sw]

                  description: Optional owned, human-approved Foundry build ID
                price_usd_cents:
                  type: integer
                country_origin:
                  type: string
                  default: KE
                bom_by_country:
                  type: object
                guides_by_language:
                  type: object
      responses:
        '202':
          description: Listing saved as pending_review
